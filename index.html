<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>دفتري الرقمي | Daftari Digital</title>
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <style>
    :root {
      --bg: #070e1b;
      --surface: #101b2e;
      --surface-2: #0a1323;
      --border: #1e3150;
      --text: #f8fafc;
      --muted: #94a3b8;
      --primary: #2563eb;
      --gold: #d4af37;
      --success: #22c55e;
      --warning: #f59e0b;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
    }

    body {
      background: radial-gradient(circle at top, #13274a 0%, var(--bg) 68%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 12px;
    }

    .app-shell {
      width: 100%;
      max-width: 500px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .hidden { display: none !important; }

    /* واجهات القدوم (Onboarding) */
    .welcome-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 28px 20px;
      margin-top: 20px;
      text-align: center;
      box-shadow: 0 22px 50px rgba(0,0,0,0.5);
    }

    .welcome-icon {
      width: 76px;
      height: 76px;
      margin: 0 auto 16px;
      border-radius: 22px;
      background: linear-gradient(135deg, #1d4ed8, #0f294a);
      border: 1px solid rgba(255,255,255,0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 34px;
    }

    .dots {
      display: flex;
      justify-content: center;
      gap: 7px;
      margin: 18px 0;
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 999px;
      background: #334155;
      transition: 0.25s;
    }

    .dot.active {
      width: 24px;
      background: #3b82f6;
    }

    /* شاشة اختيار الفضاء (الشعب / الموظف) */
    .role-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin: 16px 0;
    }

    .role-card {
      background: var(--surface-2);
      border: 2px solid var(--border);
      border-radius: 16px;
      padding: 16px 10px;
      cursor: pointer;
      transition: 0.2s;
    }

    .role-card.active {
      border-color: #3b82f6;
      background: #142746;
    }

    .role-card.staff.active {
      border-color: var(--gold);
      background: #232118;
    }

    .pin-input {
      width: 100%;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: #fff;
      text-align: center;
      font-size: 1.2rem;
      letter-spacing: 6px;
      margin-bottom: 12px;
    }

    /* الشريط العلوي */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 12px 14px;
      border-radius: 16px;
      gap: 8px;
    }

    .header h2 { font-size: 1rem; }
    .header span { font-size: 0.72rem; color: var(--muted); }

    .header-actions {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .mini-btn {
      background: var(--surface-2);
      color: #cbd5e1;
      border: 1px solid var(--border);
      padding: 6px 9px;
      border-radius: 9px;
      font-size: 0.74rem;
      cursor: pointer;
    }

    .switch-btn {
      background: rgba(239, 68, 68, 0.14);
      color: #fca5a5;
      border: 1px solid rgba(239, 68, 68, 0.35);
      padding: 6px 9px;
      border-radius: 9px;
      font-size: 0.74rem;
      cursor: pointer;
    }

    /* شريط الحالة (Offline + Frozen) */
    .status-strip {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(34, 197, 94, 0.1);
      border: 1px solid rgba(34, 197, 94, 0.3);
      padding: 7px 12px;
      border-radius: 11px;
      font-size: 0.75rem;
      color: #86efac;
    }

    .status-strip.frozen {
      background: rgba(239, 68, 68, 0.14);
      border-color: rgba(239, 68, 68, 0.45);
      color: #fca5a5;
    }

    /* التبويبات */
    .tabs {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      background: var(--surface);
      padding: 6px;
      border-radius: 14px;
      border: 1px solid var(--border);
    }

    .tab-btn {
      background: transparent;
      border: none;
      color: var(--muted);
      padding: 8px 4px;
      border-radius: 10px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
    }

    .tab-btn.active {
      background: #1d4ed8;
      color: #fff;
    }

    /* البطاقة الذكية */
    .tier-switcher {
      display: flex;
      gap: 6px;
      margin-bottom: 10px;
    }

    .tier-btn {
      flex: 1;
      padding: 7px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--muted);
      font-size: 0.75rem;
      cursor: pointer;
    }

    .tier-btn.active {
      color: #fff;
      border-color: #60a5fa;
      background: #172a4a;
      font-weight: bold;
    }

    .smart-card {
      border-radius: 20px;
      padding: 18px;
      min-height: 165px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border: 1px solid rgba(255,255,255,0.2);
      box-shadow: 0 14px 30px rgba(0,0,0,0.45);
      position: relative;
      overflow: hidden;
    }

    .tier-silver { background: linear-gradient(135deg, #0f294a 0%, #1e3a5f 60%, #94a3b8 100%); }
    .tier-gold { background: linear-gradient(135deg, #0c2240 0%, #163763 58%, #b8891e 100%); }
    .tier-platinum { background: linear-gradient(135deg, #071224 0%, #132542 55%, #cbd5e1 100%); }

    .frozen-overlay {
      position: absolute;
      inset: 0;
      background: rgba(127, 29, 29, 0.88);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 12px;
      font-weight: bold;
    }

    .card-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .chip {
      width: 36px;
      height: 26px;
      border-radius: 6px;
      background: linear-gradient(135deg, #e2e8f0, #94a3b8);
    }

    .card-serial {
      font-family: monospace;
      font-size: 0.94rem;
      font-weight: bold;
      background: rgba(0,0,0,0.35);
      padding: 4px 9px;
      border-radius: 8px;
    }

    /* اللوحات والأزرار */
    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px;
    }

    .panel-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      gap: 8px;
    }

    .cat-filter {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 6px;
      margin-bottom: 10px;
    }

    .cat-pill {
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 5px 10px;
      border-radius: 999px;
      font-size: 0.74rem;
      cursor: pointer;
      white-space: nowrap;
    }

    .cat-pill.active {
      background: #1d4ed8;
      color: #fff;
      border-color: #3b82f6;
    }

    .btn-primary {
      background: #2563eb;
      color: #fff;
      border: none;
      padding: 9px 12px;
      border-radius: 10px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-gold {
      background: var(--gold);
      color: #08101e;
      border: none;
      padding: 8px 10px;
      border-radius: 9px;
      font-size: 0.75rem;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-green {
      background: #16a34a;
      color: #fff;
      border: none;
      padding: 8px 10px;
      border-radius: 9px;
      font-size: 0.75rem;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-danger {
      background: rgba(239, 68, 68, 0.16);
      color: #fca5a5;
      border: 1px solid rgba(239, 68, 68, 0.4);
      padding: 8px 10px;
      border-radius: 9px;
      font-size: 0.75rem;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-outline {
      background: transparent;
      color: #cbd5e1;
      border: 1px solid var(--border);
      padding: 7px 9px;
      border-radius: 9
